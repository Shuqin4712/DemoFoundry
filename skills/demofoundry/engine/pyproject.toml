[project]
name = "demofoundry"
version = "0.1.0"
description = "Build narrated product tutorial videos from a rebuilt UI component library (HyperFrames compositions)."
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
# transcription for imported narration (word timestamps)
whisper = ["faster-whisper>=1.0"]
# node glow colours picked from images
image = ["pillow>=10.0"]

[project.scripts]
demofoundry = "demofoundry.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["demofoundry"]
