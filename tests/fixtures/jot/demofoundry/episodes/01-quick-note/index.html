<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: #0b0d10; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0b0d10; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
      
      .series-brand { position: absolute; left: 82px; top: 67px; z-index: 50; display: flex; align-items: center; color: #9aa1aa; font-family: Inter, Arial, sans-serif; font-size: 16px; letter-spacing: 0.14em; text-transform: uppercase; pointer-events: none; }
      .series-brand img { width: 24px; height: 24px; display: block; margin-right: 10px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <!-- generated; seam blocks are stamped from ledger.json by seam-stamp.mjs -->
    <div id="root" data-composition-id="quick-note" data-start="0" data-duration="23.6" data-width="1920" data-height="1080">
      <div id="scene-story" class="scene" data-composition-id="story" data-composition-src="compositions/frames/01-story.html" data-start="0" data-duration="19.6" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="scene-end-card" class="scene" data-composition-id="end-card" data-composition-src="compositions/frames/02-end-card.html" data-start="19.6" data-duration="4.0" data-track-index="1" data-width="1920" data-height="1080"></div>
      <hf-audio-group id="voiceover" data-label="Voiceover" data-volume="0.75"></hf-audio-group>
      <div id="seriesBrand" class="series-brand" data-layout-ignore="">Jot Tutorials</div>
      <audio id="vo-sec0" src="voice/final/clips/sec0.wav" data-start="0.2" data-duration="3.0" data-audio-group="voiceover" data-track-index="10" data-volume="1"></audio>
      <audio id="vo-sec1" src="voice/final/clips/sec1.wav" data-start="4.2" data-duration="2.9" data-audio-group="voiceover" data-track-index="10" data-volume="1"></audio>
      <audio id="vo-sec2" src="voice/final/clips/sec2.wav" data-start="7.9" data-duration="3.1" data-audio-group="voiceover" data-track-index="10" data-volume="1"></audio>
      <audio id="vo-sec3" src="voice/final/clips/sec3.wav" data-start="12.2" data-duration="3.2" data-audio-group="voiceover" data-track-index="10" data-volume="1"></audio>
      <audio id="vo-sec4" src="voice/final/clips/sec4.wav" data-start="16.4" data-duration="2.2" data-audio-group="voiceover" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // <seams:auto>
      // </seams:auto>
      tl.set("#seriesBrand", {autoAlpha:0}, 19.6);
      window.__timelines["quick-note"] = tl;
    </script>
  </body>
</html>
